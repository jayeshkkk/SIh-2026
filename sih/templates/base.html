<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NER Logistics Intelligence Platform{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a5276;
            --primary-light: #2e86ab;
            --secondary: #27ae60;
            --secondary-dark: #219a52;
            --accent: #e67e22;
            --danger: #e74c3c;
            --warning: #f39c12;
            --info: #3498db;
            --dark: #1a252f;
            --gray: #7f8c8d;
            --light: #ecf0f1;
            --white: #ffffff;
            --bg: #f4f6f9;
            --border: #ddd;
            --border-light: #eee;
            --border-lighter: #f5f5f5;
            --hover-bg: #fafbfc;
            --purple: #9b59b6;
            --scroll: #ccc;
            --scroll-hover: #aaa;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.15);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
        }
        .layout { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--dark);
            color: var(--white);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .sidebar-header .logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .sidebar-header .logo i { color: var(--accent); }
        .sidebar-header .subtitle {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-section { padding: 10px 0; }
        .nav-section-title {
            padding: 10px 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.4);
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.05);
            color: var(--white);
            border-left-color: var(--accent);
        }
        .nav-item i { width: 20px; text-align: center; font-size: 0.95rem; }
        .nav-item .badge {
            margin-left: auto;
            background: var(--danger);
            color: var(--white);
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Main Content */
        .main {
            flex: 1;
            margin-left: 260px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            background: var(--white);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--dark);
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .lang-selector {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .offline-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--warning);
            color: var(--white);
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .sync-btn {
            padding: 6px 14px;
            background: var(--secondary);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sync-btn:hover { background: var(--secondary-dark); }

        .content { padding: 25px 30px; flex: 1; }

        /* Cards */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .map-card {
            align-self: stretch;
            display: flex;
            flex-direction: column;
        }
        .map-card .card-body {
            flex: 1;
            min-height: 420px;
            display: flex;
            padding: 0;
        }
        .map-card .map-view {
            flex: 1;
            min-height: 420px;
            width: 100%;
        }
        .card-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-header h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--dark);
        }
        .card-body { padding: 22px; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .stat-icon.blue { background: rgba(52,152,219,0.1); color: var(--info); }
        .stat-icon.green { background: rgba(39,174,96,0.1); color: var(--secondary); }
        .stat-icon.orange { background: rgba(230,126,34,0.1); color: var(--accent); }
        .stat-icon.red { background: rgba(231,76,60,0.1); color: var(--danger); }
        .stat-icon.purple { background: rgba(155,89,182,0.1); color: #9b59b6; }
        .stat-info h4 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--dark);
            line-height: 1.2;
        }
        .stat-info p {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 2px;
        }
        .stat-trend {
            font-size: 0.75rem;
            margin-top: 4px;
            font-weight: 600;
        }
        .stat-trend.up { color: var(--danger); }
        .stat-trend.down { color: var(--secondary); }

        /* Status badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-success { background: rgba(39,174,96,0.15); color: var(--secondary); }
        .badge-warning { background: rgba(243,156,18,0.15); color: var(--warning); }
        .badge-danger { background: rgba(231,76,60,0.15); color: var(--danger); }
        .badge-info { background: rgba(52,152,219,0.15); color: var(--info); }
        .badge-dark { background: rgba(26,37,47,0.1); color: var(--dark); }

        /* Tables */
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th {
            text-align: left;
            padding: 12px 15px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-light);
        }
        .data-table td {
            padding: 14px 15px;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-lighter);
        }
        .data-table tr:hover td { background: var(--hover-bg); }

        /* Progress bars */
        .progress { height: 8px; background: var(--border-light); border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .progress-bar.success { background: var(--secondary); }
        .progress-bar.warning { background: var(--warning); }
        .progress-bar.danger { background: var(--danger); }

        /* Map */
        #map { height: calc(100vh - 80px); width: 100%; border-radius: var(--radius); }
        .map-container { height: calc(100vh - 130px); border-radius: var(--radius); overflow: hidden; }

        /* Forms */
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,82,118,0.1);
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-success { background: var(--secondary); color: var(--white); }
        .btn-success:hover { background: var(--secondary-dark); }
        .btn-danger { background: var(--danger); color: var(--white); }
        .btn-warning { background: var(--warning); color: var(--white); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--dark); }
        .btn-outline:hover { background: var(--border-lighter); }

        /* Grid layouts */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse { animation: pulse 2s infinite; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slide-in { animation: slideIn 0.4s ease-out; }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; }
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .grid-3, .grid-2 { grid-template-columns: 1fr; }
            .grid-4 { grid-template-columns: 1fr; }
            .content { padding: 15px; }
            .stats-grid { grid-template-columns: 1fr; }
        }

        /* Alert items */
        .alert-item {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .alert-item.critical { background: rgba(231,76,60,0.08); border-left-color: var(--danger); }
        .alert-item.high { background: rgba(230,126,34,0.08); border-left-color: var(--accent); }
        .alert-item.medium { background: rgba(243,156,18,0.08); border-left-color: var(--warning); }
        .alert-item.low { background: rgba(52,152,219,0.08); border-left-color: var(--info); }
        .alert-icon { font-size: 1.1rem; margin-top: 2px; }
        .alert-item.critical .alert-icon { color: var(--danger); }
        .alert-item.high .alert-icon { color: var(--accent); }
        .alert-item.medium .alert-icon { color: var(--warning); }
        .alert-item.low .alert-icon { color: var(--info); }
        .alert-content h4 { font-size: 0.9rem; font-weight: 700; }
        .alert-content p { font-size: 0.82rem; color: var(--gray); margin-top: 2px; }
        .alert-meta { font-size: 0.75rem; color: var(--gray); margin-top: 4px; }

        /* Vehicle card */
        .vehicle-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .vehicle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .vehicle-number {
            font-weight: 700;
            font-size: 1rem;
            color: var(--dark);
        }
        .vehicle-route {
            font-size: 0.85rem;
            color: var(--gray);
        }
        .vehicle-meta {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--gray);
        }
        .vehicle-meta span { display: flex; align-items: center; gap: 4px; }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--gray);
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Filters */
        .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-select {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            background: var(--white);
        }

        /* Route segment */
        .route-segment {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border-light);
        }
        .route-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .route-line {
            width: 2px;
            height: 30px;
            background: var(--border);
            margin-left: 5px;
        }

        /* Risk meter */
        .risk-meter {
            width: 100%;
            height: 6px;
            background: var(--border-light);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }
        .risk-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s;
        }
        .risk-fill.low { background: var(--secondary); }
        .risk-fill.medium { background: var(--warning); }
        .risk-fill.high { background: var(--accent); }
        .risk-fill.critical { background: var(--danger); }

        /* Mobile toggle */
        .mobile-toggle {
            display: none;
            padding: 10px;
            background: var(--dark);
            color: var(--white);
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
        }
        @media (max-width: 1024px) {
            .mobile-toggle { display: block; position: fixed; top: 10px; left: 10px; z-index: 1001; border-radius: 6px; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #aaa; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo"><i class="fas fa-network-wired"></i> NER-LAIP</div>
                <div class="subtitle">Logistics & Accessibility</div>
            </div>
            <nav class="nav-section">
                <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
                    <i class="fas fa-home"></i> <span data-i18n="dashboard">Dashboard</span>
                </a>
                <a href="/map" class="nav-item {% if request.path == '/map' %}active{% endif %}">
                    <i class="fas fa-map-marked-alt"></i> <span data-i18n="map">Map</span>
                </a>
                <a href="/vehicles" class="nav-item {% if request.path == '/vehicles' %}active{% endif %}">
                    <i class="fas fa-truck"></i> <span data-i18n="vehicles">Vehicles</span>
                </a>
                <a href="/route-planner" class="nav-item {% if request.path == '/route-planner' %}active{% endif %}">
                    <i class="fas fa-route"></i> <span data-i18n="routes">Route Planner</span>
                </a>
                <a href="/predictions" class="nav-item {% if request.path == '/predictions' %}active{% endif %}">
                    <i class="fas fa-brain"></i> <span data-i18n="predictions">AI Predictions</span>
                </a>
            </nav>
            <nav class="nav-section">
                <div class="nav-section-title">Operations</div>
                <a href="/field-reports" class="nav-item {% if request.path == '/field-reports' %}active{% endif %}">
                    <i class="fas fa-clipboard-list"></i> Field Reports
                </a>
            </nav>
            <nav class="nav-section">
                <div class="nav-section-title">Settings</div>
                <a href="#" class="nav-item" onclick="toggleOfflineMode(); return false;">
                    <i class="fas fa-wifi"></i> <span id="offline-label">Offline Mode</span>
                </a>
            </nav>
        </aside>

        <main class="main">
            <div class="topbar">
                <h1>{% block page_title %}Dashboard{% endblock %}</h1>
                <div class="topbar-actions">
                    <select class="lang-selector" id="langSelector" onchange="changeLanguage(this.value)">
                        <option value="en">English</option>
                        <option value="hi">हिंदी</option>
                        <option value="as">অসমীয়া</option>
                    </select>
                    <div class="offline-badge" id="offlineBadge" style="display:none;" onclick="syncOfflineData()">
                        <i class="fas fa-sync-alt"></i> Sync Now
                    </div>
                    <div style="font-size:0.85rem; color:var(--gray);">
                        <i class="fas fa-clock"></i> <span id="currentTime"></span>
                    </div>
                </div>
            </div>
            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Current language
        let currentLang = localStorage.getItem('ner-lang') || 'en';
        let translations = {};
        let isOffline = false;
        let offlineQueue = JSON.parse(localStorage.getItem('ner-offline-queue') || '[]');

        // Update time
        function updateTime() {
            const el = document.getElementById('currentTime');
            if (el) el.textContent = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Language switcher
        async function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('ner-lang', lang);
            document.getElementById('langSelector').value = lang;
            try {
                const res = await fetch(`/api/translations/${lang}`);
                translations = await res.json();
                applyTranslations();
            } catch (e) {
                console.error('Failed to load translations:', e);
            }
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[key]) el.textContent = translations[key];
            });

            const applyTranslationValue = (id, key, fallback) => {
                const el = document.getElementById(id);
                if (el && translations[key]) {
                    el.textContent = translations[key];
                } else if (el && fallback) {
                    el.textContent = fallback;
                }
            };

            applyTranslationValue('offline-label', 'offline_mode', 'Offline Mode');
            applyTranslationValue('offlineBadge', 'sync_data', 'Sync Now');
        }

        // Offline mode
        function toggleOfflineMode() {
            isOffline = !isOffline;
            const badge = document.getElementById('offlineBadge');
            const label = document.getElementById('offline-label');
            if (isOffline) {
                badge.style.display = 'flex';
                label.textContent = 'Online Mode';
                fetchOfflineData();
            } else {
                badge.style.display = 'none';
                label.textContent = 'Offline Mode';
            }
        }

        async function fetchOfflineData() {
            try {
                const res = await fetch('/api/sync/fetch-offline');
                const data = await res.json();
                localStorage.setItem('ner-offline-data', JSON.stringify(data));
                console.log('Offline data cached');
            } catch (e) {
                console.error('Failed to fetch offline data:', e);
            }
        }

        async function syncOfflineData() {
            if (offlineQueue.length === 0) {
                alert('No offline data to sync');
                return;
            }
            try {
                const res = await fetch('/api/sync/offline-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reports: offlineQueue })
                });
                const data = await res.json();
                if (data.success) {
                    offlineQueue = [];
                    localStorage.setItem('ner-offline-queue', '[]');
                    alert(`Synced ${data.synced_count} items successfully!`);
                    location.reload();
                }
            } catch (e) {
                alert('Sync failed. Will retry when connected.');
            }
        }

        function queueOfflineReport(report) {
            offlineQueue.push({
                ...report,
                reported_at: new Date().toISOString()
            });
            localStorage.setItem('ner-offline-queue', JSON.stringify(offlineQueue));
            alert('Report saved locally. Will sync when online.');
        }

        // Mobile sidebar
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Initialize
        document.getElementById('langSelector').value = currentLang;
        changeLanguage(currentLang);

        // Network status
        window.addEventListener('online', () => {
            if (offlineQueue.length > 0) syncOfflineData();
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
